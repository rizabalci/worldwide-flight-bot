name: Daily Worldwide Flight Scan

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily (~08:00/09:00 Vienna)
  workflow_dispatch: {}    # lets you run it manually from the Actions tab

permissions:
  contents: write          # needed to commit price_history.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROLLING_WINDOW_DAYS: ${{ vars.ROLLING_WINDOW_DAYS }}
          ROLLING_DROP_PCT: ${{ vars.ROLLING_DROP_PCT }}
          SHORT_HAUL_MONTHS: ${{ vars.SHORT_HAUL_MONTHS }}
          LONG_HAUL_MONTHS: ${{ vars.LONG_HAUL_MONTHS }}
          ORIGINS: ${{ vars.ORIGINS }}
        run: python check_flights.py

      - name: Commit updated price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.json
          if git diff --staged --quiet; then
            echo "No price history changes to commit."
          else
            git commit -m "Update price history $(date -u +%Y-%m-%d)"
            git push
          fi
