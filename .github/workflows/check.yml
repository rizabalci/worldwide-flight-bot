name: Daily Worldwide Flight Scan

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily (~08:00/09:00 Vienna)
  workflow_dispatch: {}    # lets you run it manually from the Actions tab

permissions:
  contents: write          # needed to commit price_history.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROLLING_WINDOW_DAYS: ${{ vars.ROLLING_WINDOW_DAYS }}
          ROLLING_DROP_PCT: ${{ vars.ROLLING_DROP_PCT }}
          TARGET_MARGIN_PCT: ${{ vars.TARGET_MARGIN_PCT }}
          SHORT_HAUL_MONTHS: ${{ vars.SHORT_HAUL_MONTHS }}
          LONG_HAUL_MONTHS: ${{ vars.LONG_HAUL_MONTHS }}
          SHORT_HAUL_MAX_NIGHTS: ${{ vars.SHORT_HAUL_MAX_NIGHTS }}
          LONG_HAUL_MAX_NIGHTS: ${{ vars.LONG_HAUL_MAX_NIGHTS }}
          ORIGINS: ${{ vars.ORIGINS }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          WEEKEND_ONLY: ${{ vars.WEEKEND_ONLY }}
          MIN_NIGHTS: ${{ vars.MIN_NIGHTS }}
          MAX_NIGHTS: ${{ vars.MAX_NIGHTS }}
          DEP_DAYS: ${{ vars.DEP_DAYS }}
          HEARTBEAT: ${{ vars.HEARTBEAT }}
          MUTE: ${{ vars.MUTE }}
          FOCUS: ${{ vars.FOCUS }}
        run: python check_flights.py

      - name: Commit updated price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.json deals.json index.html 2>/dev/null || git add price_history.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update price history $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              if git push; then
                echo "Pushed on attempt $i."
                break
              fi
              echo "Push $i failed; pulling and retrying..."
              git pull --rebase --no-edit || git rebase --abort
              sleep 3
            done
          fi
